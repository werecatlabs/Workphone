<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AAA FX Particles</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#000;font-family:Arial;color:#fff}#c{width:100vw;height:100vh}#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.8);padding:12px;border-radius:6px;z-index:10;font-size:12px;min-width:240px}#ui h3{margin:0 0 8px 0;color:#4ff}button{margin:3px;padding:6px 12px;background:#333;color:#fff;border:1px solid #555;border-radius:3px;cursor:pointer;font-size:12px}button:hover{background:#555}#fps{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.75);padding:8px;border-radius:6px;font-family:monospace}#info{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,.8);padding:10px;border-radius:6px;font-size:11px;max-width:340px;line-height:1.4}#info b{color:#4ff}</style></head><body><canvas id="c"></canvas><div id="ui"><h3>AAA FX System</h3><button id="e1">Small Explosion</button><button id="e2">Big Explosion</button><button id="e3">Burst (10x)</button><button id="e4">Muzzle Flash</button><br><button id="e5">Smoke Column</button><button id="e6">Dust Cloud</button><br><button id="cl">Clear All</button><div id="count">Active: 0</div></div><div id="fps">FPS: <span id="f">0</span></div><div id="info"><b>AAA Particle System:</b> 16 procedural particle types in a 4x4 atlas. Explosion phases: 1)Core flash(85ms) 2)Fireball(400ms) 3)Shockwave ring(200ms) 4)Smoke(2s+) 5)Debris cone(800ms) 6)Embers. <b>Controls:</b> Click button or press 1-6.</div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><script type="module">import * as THREE from "three";import {OrbitControls}from"three/addons/controls/OrbitControls.js";
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x4a4a55);scene.fog=new THREE.FogExp2(0x4a4a55,0.012);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,500);camera.position.set(8,5,12);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.target.set(0,1,0);
const sun=new THREE.DirectionalLight(0xffeedd,1.2);sun.position.set(10,20,10);scene.add(sun);
scene.add(new THREE.HemisphereLight(0x88aaff,0x886644,0.4));
// Ground
const groundMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.85});const gnd=new THREE.Mesh(new THREE.PlaneGeometry(60,60),groundMat);gnd.rotateX(-Math.PI/2);gnd.receiveShadow=true;scene.add(gnd);
// Walls for context
const wallMat=new THREE.MeshStandardMaterial({color:0xa89878,roughness:0.9});
for(let i=0;i<4;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(15,4,0.3),wallMat);const ang=i*Math.PI/2;w.position.set(Math.sin(ang)*7.5,2,Math.cos(ang)*7.5);w.rotation.y=ang;scene.add(w)}
// Boxes
for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),wallMat);b.position.set((Math.random()-0.5)*8,0.5,(Math.random()-0.5)*8);scene.add(b)}

// === Particle Atlas Generator ===
function hash(x,y,z){let h=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return h-Math.floor(h)}
function noise3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);let acc=0;for(let dz=0;dz<2;dz++){for(let dy=0;dy<2;dy++){for(let dx=0;dx<2;dx++){const wx=dx?u:1-u,wy=dy?v:1-v,wz=dz?w:1-w;const h=hash(xi+dx,yi+dy,zi+dz);acc+=h*wx*wy*wz}}}return acc}
function fbm(x,y,z,oct){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=a*noise3(x*f,y*f,z*f);a*=0.5;f*=2}return v}
function worley(x,y){const xi=Math.floor(x),yi=Math.floor(y);let md=1e9;for(let dx=-1;dx<=1;dx++){for(let dy=-1;dy<=1;dy++){const h=hash(xi+dx,yi+dy,0);const d=Math.hypot(x-dx-h,y-dy);if(d<md)md=d}}return md}

const ATLAS_SIZE=512;const TILE=ATLAS_SIZE/4;
const atlasCanvas=document.createElement("canvas");atlasCanvas.width=ATLAS_SIZE;atlasCanvas.height=ATLAS_SIZE;const atx=atlasCanvas.getContext("2d");

function paintSmoke(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const warp=noise3(x*3+seed,y*3,seed)*0.8;const lump=worley(x*4+seed,y*4+seed);const tear=fbm(x*7-2,y*7,3);let a=Math.max(0,Math.min(1,1-r+(warp-0.5)*0.8+(lump-0.45)*0.26));a*=1-Math.max(0,Math.min(1,(r-0.35)/0.6))*(1-tear)*0.85;a*=Math.max(0,Math.min(1,(1.02-r)/0.36));a=Math.max(0,Math.min(1,a));const detail=fbm(x*6-3,y*6,4);const l=Math.floor((0.42+0.66*detail*detail)*a*255);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=Math.floor(l*0.995);data.data[i+2]=Math.floor(l*0.99);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintFire(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const core=Math.exp(-r*r*8),glow=Math.exp(-r*r*2)*0.5;let a=Math.max(0,Math.min(1,core+glow))*Math.max(0,Math.min(1,(1-r)/0.3));const hot=Math.max(0,1-r*1.5);const i=(py*TILE+px)*4;data.data[i]=Math.floor((a+hot*0.5)*255);data.data[i+1]=Math.floor((a*0.7+hot*0.3)*255);data.data[i+2]=Math.floor((a*0.2)*255);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintDust(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const w=worley(x*5+seed,y*5)*0.7;const grit=fbm(x*15+2,y*15,2)*0.3;let a=Math.max(0,Math.min(1,1-r*1.04+(w-0.5)*0.86));a*=1-Math.max(0,Math.min(1,(r-0.25)/0.65))*(1-grit)*0.8;a*=Math.max(0,Math.min(1,(1-r)/0.38));a=Math.max(0,Math.min(1,a));const l=Math.floor((0.48+0.42*w+0.1*grit)*a*255);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=Math.floor(l*0.985);data.data[i+2]=Math.floor(l*0.96);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintSpark(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const core=Math.exp(-r*r*26),glow=Math.exp(-r*r*4.5)*0.4;let a=Math.max(0,Math.min(1,core+glow))*Math.max(0,Math.min(1,(1-r)/0.15));const i=(py*TILE+px)*4;data.data[i]=255;data.data[i+1]=255;data.data[i+2]=255;data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintDebris(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const ang=Math.atan2(y,x);const angs=Math.abs(Math.cos(ang*3+noise3(x*2,y*2,0)*2));const sh=Math.max(0,Math.min(1,(angs-0.6)/0.3))*(1-r*0.5);let a=Math.max(0,Math.min(1,sh));const l=Math.floor(a*200);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=Math.floor(l*0.9);data.data[i+2]=Math.floor(l*0.85);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintSmokeRing(col,row,seed){paintSmoke(col,row,seed+10)}
function paintFlash(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const core=Math.exp(-r*r*30),glow=Math.exp(-r*r*6)*0.7,halo=Math.exp(-r*r*2)*0.3;let a=Math.max(0,Math.min(1,core+glow+halo));const i=(py*TILE+px)*4;data.data[i]=255;data.data[i+1]=255;data.data[i+2]=255;data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintEmber(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const core=Math.exp(-r*r*40);let a=Math.max(0,Math.min(1,core))*0.9;const i=(py*TILE+px)*4;data.data[i]=255;data.data[i+1]=Math.floor(180*a);data.data[i+2]=Math.floor(50*a);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintStreak(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1;const hW=0.1*(0.5+0.5*Math.max(-1,Math.min(1,y)));const q=Math.abs(x)/hW;const dist=Math.hypot(q,y);let a=Math.max(0,Math.min(1,1-dist*2));a*=Math.max(0,Math.min(1,(y+1)*0.5));const i=(py*TILE+px)*4;data.data[i]=255;data.data[i+1]=Math.floor(180*a);data.data[i+2]=Math.floor(50*a);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintWisp(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x*1.05,y*0.78);const f=Math.max(0,Math.min(1,(fbm(x*3,y*2,3)-0.3)/0.7));const body=Math.max(0,Math.min(1,1-r));let a=f*body*Math.max(0,Math.min(1,(1-r)/0.5));const l=Math.floor((0.5+f*0.5)*a*255);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=l;data.data[i+2]=l;data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintChip(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const ang=Math.atan2(y,x);const sh=Math.abs(Math.cos(ang*4+noise3(x*3,y*3,0)));let a=Math.max(0,Math.min(1,(sh-0.4)/0.6))*(1-r*0.6);const l=Math.floor(a*160);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=Math.floor(l*0.85);data.data[i+2]=Math.floor(l*0.75);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintDroplet(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);let a=Math.max(0,Math.min(1,1-r*1.5));a=Math.pow(a,2);const i=(py*TILE+px)*4;data.data[i]=200;data.data[i+1]=220;data.data[i+2]=255;data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintRing(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const ring=Math.exp(-((r-0.6)*(r-0.6))/0.01);let a=Math.max(0,Math.min(1,ring));a*=Math.max(0,Math.min(1,(1-r)/0.4));const i=(py*TILE+px)*4;data.data[i]=255;data.data[i+1]=Math.floor(220*a);data.data[i+2]=Math.floor(150*a);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintMist(col,row,seed){paintDust(col,row,seed+5)}
function paintMote(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const core=Math.exp(-r*r*8);let a=Math.max(0,Math.min(1,core))*0.6;const i=(py*TILE+px)*4;data.data[i]=220;data.data[i+1]=210;data.data[i+2]=200;data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}
function paintSplash(col,row,seed){paintDroplet(col,row,seed)}
function paintWoodChip(col,row,seed){const data=atx.createImageData(TILE,TILE);for(let py=0;py<TILE;py++){for(let px=0;px<TILE;px++){const x=(px/TILE)*2-1,y=(py/TILE)*2-1,r=Math.hypot(x,y);const ang=Math.atan2(y,x);const grain=Math.abs(Math.sin(ang*8+noise3(x*5,y*5,0)));let a=Math.max(0,Math.min(1,(grain-0.3)/0.7))*(1-r*0.5);const l=Math.floor(a*120);const i=(py*TILE+px)*4;data.data[i]=l;data.data[i+1]=Math.floor(l*0.65);data.data[i+2]=Math.floor(l*0.4);data.data[i+3]=Math.floor(a*255)}}atx.putImageData(data,col*TILE,row*TILE)}

// Paint 16 tiles: 0=Smoke, 1=Fire, 2=Dust, 3=Spark, 4=Debris, 5=Flash, 6=Ember, 7=Streak, 8=SmokeB, 9=Wisp, 10=Droplet, 11=Mist, 12=Ring, 13=Chip, 14=Splash, 15=WoodChip
paintSmoke(0,0,1);paintFire(1,0,2);paintDust(2,0,3);paintSpark(3,0,4);
paintDebris(0,1,5);paintFlash(1,1,6);paintEmber(2,1,7);paintStreak(3,1,8);
paintSmokeRing(0,2,9);paintWisp(1,2,10);paintDroplet(2,2,11);paintMist(3,2,12);
paintRing(0,3,13);paintChip(1,3,14);paintSplash(2,3,15);paintWoodChip(3,3,16);

const atlasTex=new THREE.CanvasTexture(atlasCanvas);atlasTex.wrapS=atlasTex.wrapT=THREE.RepeatWrapping;

function getTileUV(idx){const col=idx%4,row=Math.floor(idx/4);return new THREE.Vector4(col/4,row/4,1/4,1/4)}

// === Particle System ===
class Particle{constructor(opts){this.pos=opts.pos.clone();this.vel=opts.vel.clone();this.size=opts.size;this.sizeEnd=opts.sizeEnd||opts.size;this.sizeCurve=opts.sizeCurve||0.3;this.life=opts.life;this.maxLife=opts.life;this.grav=opts.grav||0;this.drag=opts.drag||1;this.color=opts.color||new THREE.Color(1,1,1);this.alphaEnd=opts.alphaEnd||0;this.alphaCurve=opts.alphaCurve||0.5;this.tile=opts.tile||0;this.rot=opts.rot||0;this.spin=opts.spin||0;this.blend=opts.blend||THREE.AdditiveBlending;this.turb=opts.turb||0;this.turbFreq=opts.turbFreq||1;this.soft=opts.soft||1;this.seed=opts.seed||Math.random()*100}}
class ParticleSystem{constructor(){this.particles=[];this.maxParticles=8000;this.geo=new THREE.PlaneGeometry(1,1);this.meshPool=[]}createParticle(opts){if(this.particles.length>=this.maxParticles){const old=this.particles.shift();if(old.mesh){scene.remove(old.mesh)}}const tile=getTileUV(opts.tile);const mat=new THREE.MeshBasicMaterial({map:atlasTex,transparent:true,blending:opts.blend||THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});mat.onBeforeCompile=(shader)=>{shader.fragmentShader=shader.fragmentShader.replace("#include <map_fragment>",`#ifdef USE_MAP
vec4 sampledDiffuse=texture2D(map,vMapUv);
vec2 tileUV=vec2(${tile.x.toFixed(3)}+vMapUv.x*${tile.z.toFixed(3)},${tile.y.toFixed(3)}+vMapUv.y*${tile.w.toFixed(3)});
vec4 tileSample=texture2D(map,tileUV);
diffuseColor*=tileSample;`)};const mesh=new THREE.Mesh(this.geo,mat);mesh.position.copy(opts.pos);mesh.renderOrder=999;scene.add(mesh);const p=new Particle(opts);p.mesh=mesh;p.mat=mat;this.particles.push(p)}update(dt){for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.life-=dt;if(p.life<=0){scene.remove(p.mesh);p.mesh.material.dispose();this.particles.splice(i,1);continue}p.vel.y+=p.grav*dt;p.vel.multiplyScalar(1-p.drag*dt);if(p.turb>0){p.vel.x+=Math.sin(p.life*p.turbFreq+p.seed)*p.turb*dt;p.vel.z+=Math.cos(p.life*p.turbFreq+p.seed)*p.turb*dt}p.mesh.position.add(p.vel.clone().multiplyScalar(dt));p.mesh.lookAt(camera.position);const t=1-p.life/p.maxLife;const size=p.size*(1-t)+(p.sizeEnd-p.size)*Math.min(1,t/p.sizeCurve);p.mesh.scale.setScalar(size);const alpha=Math.max(0,Math.min(1,1-Math.pow(t,p.alphaCurve)));p.mat.opacity=alpha*p.soft;p.rot+=p.spin*dt;p.mat.color.lerpColors(p.color,new THREE.Color(0.1,0.1,0.1),t*0.8)}document.getElementById("count").textContent="Active: "+this.particles.length}}
const ps=new ParticleSystem();

// === Explosion Phases ===
function explode(pos,radius=3){// 1. Core flash
const flash=new THREE.PointLight(0xffaa44,5*radius,radius*8);flash.position.copy(pos);flash.position.y+=1;scene.add(flash);
let flashI=5*radius;const fade=()=>{flashI*=0.85;flash.intensity=flashI;if(flashI>0.1)requestAnimationFrame(fade);else{scene.remove(flash);flash.dispose()}};setTimeout(fade,30);
// 2. Fireball (tile 1)
const nFire=Math.round(20*radius)+10;
for(let i=0;i<nFire;i++){const angle=Math.random()*Math.PI*2;const up=Math.random()*Math.PI*0.4;const sp=(2+Math.random()*4)*(radius/3);const vel=new THREE.Vector3(Math.cos(angle)*Math.sin(up)*sp,Math.cos(up)*sp*0.8,Math.sin(angle)*Math.sin(up)*sp);ps.createParticle({pos:pos.clone(),vel,size:radius*0.2+Math.random()*0.3,sizeEnd:radius*0.8+Math.random()*0.4,sizeCurve:0.3,life:0.4+Math.random()*0.4,grav:2.2,drag:3,color:new THREE.Color(1,0.5+Math.random()*0.4,0.1),alphaCurve:0.6,tile:1,blend:THREE.AdditiveBlending,soft:0.7,turb:radius*0.05,turbFreq:2.4,spin:Math.random()*4-2,seed:Math.random()*100})}
// 3. Smoke (tile 0)
const nSmoke=Math.round(40*radius)+20;
for(let i=0;i<nSmoke;i++){const angle=Math.random()*Math.PI*2;const sp=(0.5+Math.random()*1.5)*(radius/3);const vel=new THREE.Vector3(Math.cos(angle)*sp*0.3,1+Math.random()*2,Math.sin(angle)*sp*0.3);ps.createParticle({pos:pos.clone().add(new THREE.Vector3(0,0.5,0)),vel,size:radius*0.4+Math.random()*0.3,sizeEnd:radius*1.2+Math.random()*0.6,sizeCurve:0.5,life:2+Math.random()*2,grav:-0.9,drag:1.9,color:new THREE.Color(0.25,0.23,0.2),alphaCurve:1.5,tile:0,blend:THREE.NormalBlending,soft:0.5,turb:radius*0.06,turbFreq:1.1,spin:Math.random()*0.9-0.45,seed:Math.random()*100})}
// 4. Debris (tile 4)
const nDeb=Math.round(30*radius)+15;
for(let i=0;i<nDeb;i++){const angle=Math.random()*Math.PI*2;const up=Math.random()*Math.PI*0.3;const sp=(6+Math.random()*20)*(0.6+radius/8);const vel=new THREE.Vector3(Math.cos(angle)*Math.sin(up)*sp,Math.cos(up)*sp,Math.sin(angle)*Math.sin(up)*sp);ps.createParticle({pos:pos.clone(),vel,size:radius*0.05+Math.random()*0.08,life:0.8+Math.random()*1,grav:-19,drag:0.4,color:new THREE.Color(0.24,0.21,0.18),alphaCurve:0.4,tile:4,blend:THREE.NormalBlending,soft:0.06,spin:Math.random()*50-25,seed:Math.random()*100})}
// 5. Embers (tile 6)
const nEmb=Math.round(15*radius)+8;
for(let i=0;i<nEmb;i++){const angle=Math.random()*Math.PI*2;const up=Math.random()*Math.PI*0.3;const sp=(4+Math.random()*14)*(0.6+radius/8);const vel=new THREE.Vector3(Math.cos(angle)*Math.sin(up)*sp,Math.cos(up)*sp,Math.sin(angle)*Math.sin(up)*sp);ps.createParticle({pos:pos.clone(),vel,size:radius*0.03+Math.random()*0.04,life:0.5+Math.random()*1,grav:-13,drag:1.1,color:new THREE.Color(1,0.7,0.3),alphaCurve:0.6,tile:6,blend:THREE.AdditiveBlending,soft:0.06,spin:Math.random()*4-2,seed:Math.random()*100})}
// 6. Shockwave ring (tile 12)
ps.createParticle({pos:pos.clone(),vel:new THREE.Vector3(0,0.5,0),size:radius*0.5,sizeEnd:radius*2.5,sizeCurve:0.4,life:0.3,grav:0,drag:0,color:new THREE.Color(1,0.9,0.7),alphaCurve:1.1,tile:12,blend:THREE.AdditiveBlending,soft:1.2,spin:0,seed:Math.random()*100})
// 7. Scorch mark
const sGeo=new THREE.CircleGeometry(radius*1.5,32);const sMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:1,transparent:true,opacity:0.7});const s=new THREE.Mesh(sGeo,sMat);s.position.copy(pos);s.position.y+=0.02;s.rotation.x=-Math.PI/2;scene.add(s);setTimeout(()=>{sMat.opacity=0.5},2000)}

function muzzleFlash(pos,dir){// Directional lobes
for(let i=0;i<5;i++){const angle=Math.random()*0.4-0.2;const sp=8+Math.random()*4;const vel=dir.clone().multiplyScalar(sp).add(new THREE.Vector3(Math.sin(angle)*2,Math.random()*1,Math.cos(angle)*2));ps.createParticle({pos:pos.clone(),vel,size:0.3+Math.random()*0.2,sizeEnd:0.6+Math.random()*0.3,sizeCurve:0.2,life:0.06,grav:0,drag:5,color:new THREE.Color(1,0.95,0.7),alphaCurve:0.5,tile:5,blend:THREE.AdditiveBlending,soft:0.5,spin:0,seed:Math.random()*100})}ps.createParticle({pos:pos.clone(),vel:dir.clone().multiplyScalar(3),size:0.4,sizeEnd:0.8,sizeCurve:0.3,life:0.08,grav:0,drag:5,color:new THREE.Color(1,1,0.9),alphaCurve:0.5,tile:5,blend:THREE.AdditiveBlending,soft:0.5,spin:0,seed:Math.random()*100})}
function smokeColumn(pos){for(let i=0;i<50;i++){setTimeout(()=>{const angle=Math.random()*Math.PI*2;const sp=0.2+Math.random()*0.5;const vel=new THREE.Vector3(Math.cos(angle)*sp,1+Math.random()*1,Math.sin(angle)*sp);ps.createParticle({pos:pos.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5,Math.random(),(Math.random()-0.5)*0.5)),vel,size:1.5+Math.random()*1,sizeEnd:3+Math.random()*2,sizeCurve:0.7,life:3+Math.random()*2,grav:-0.5,drag:1.5,color:new THREE.Color(0.4,0.38,0.34),alphaCurve:1.5,tile:0,blend:THREE.NormalBlending,soft:0.4,turb:0.3,turbFreq:0.8,spin:Math.random()*0.5,seed:Math.random()*100})},i*30)}}
function dustCloud(pos){for(let i=0;i<60;i++){const angle=Math.random()*Math.PI*2;const sp=Math.random()*3+1;const vel=new THREE.Vector3(Math.cos(angle)*sp,Math.random()*2+1,Math.sin(angle)*sp);ps.createParticle({pos:pos.clone(),vel,size:0.8+Math.random()*0.5,sizeEnd:2+Math.random()*1,sizeCurve:0.5,life:1+Math.random()*1,grav:-0.3,drag:2,color:new THREE.Color(0.6,0.55,0.45),alphaCurve:1.5,tile:2,blend:THREE.NormalBlending,soft:0.5,turb:0.2,turbFreq:1.2,spin:Math.random()*0.8,seed:Math.random()*100})}}

document.getElementById("e1").onclick=()=>{const pos=new THREE.Vector3((Math.random()-0.5)*8,1.5,(Math.random()-0.5)*8);explode(pos,2)};
document.getElementById("e2").onclick=()=>{const pos=new THREE.Vector3((Math.random()-0.5)*6,2,(Math.random()-0.5)*6);explode(pos,5)};
document.getElementById("e3").onclick=()=>{for(let i=0;i<10;i++){setTimeout(()=>{const pos=new THREE.Vector3((Math.random()-0.5)*8,1.5,(Math.random()-0.5)*8);explode(pos,2+Math.random()*3)},i*150)}};
document.getElementById("e4").onclick=()=>{const pos=new THREE.Vector3(0,1.5,5);const dir=new THREE.Vector3(0,0,-1);muzzleFlash(pos,dir)};
document.getElementById("e5").onclick=()=>{smokeColumn(new THREE.Vector3(0,0.5,0))};
document.getElementById("e6").onclick=()=>{dustCloud(new THREE.Vector3(0,0.3,0))};
document.getElementById("cl").onclick=()=>{for(let i=ps.particles.length-1;i>=0;i--){scene.remove(ps.particles[i].mesh);ps.particles[i].mesh.material.dispose();ps.particles.splice(i,1)}};
window.onkeydown=(e)=>{if(e.key==="1")document.getElementById("e1").click();if(e.key==="2")document.getElementById("e2").click();if(e.key==="3")document.getElementById("e3").click();if(e.key==="4")document.getElementById("e4").click();if(e.key==="5")document.getElementById("e5").click();if(e.key==="6")document.getElementById("e6").click();if(e.key==="c")document.getElementById("cl").click()}

const clock=new THREE.Clock();function anim(){requestAnimationFrame(anim);const dt=clock.getDelta();ps.update(dt);controls.update();renderer.render(scene,camera);document.getElementById("f").textContent=Math.round(1/dt)}anim();window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
