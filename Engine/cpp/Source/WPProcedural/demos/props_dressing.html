<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AAA Props and Dressing</title><style>*{margin:0;padding:0}body{overflow:hidden;background:#000;font-family:Arial;color:#fff}#c{width:100vw;height:100vh}#ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.75);padding:12px;border-radius:6px;z-index:10;font-size:13px}#ui h3{margin:0 0 6px 0;color:#4ff}button{margin:3px;padding:4px 10px;background:#333;color:#fff;border:1px solid #666;border-radius:3px;cursor:pointer;font-size:12px}button:hover{background:#555}button.active{background:#048}#fps{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.75);padding:8px;border-radius:6px;font-family:monospace;font-size:14px}#info{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,.75);padding:8px;border-radius:6px;font-size:12px;max-width:300px}</style></head><body><canvas id="c"></canvas><div id="ui"><h3>AAA Props & Dressing</h3><button class="active" id="b-all">All Props</button><button id="b-sand">Sandbags</button><button id="b-jersey">Jersey Barriers</button><button id="b-crate">Crates</button><button id="b-burn">Burnt Cars</button><button id="b-check">Checkpoint</button><div id="count">Props: 0</div></div><div id="fps">FPS: <span id="f">0</span></div><div id="info">Mouse: Orbit. Wheel: Zoom. Click: Place prop. Sandbags use Lp-ball geometry (NOT ellipsoid) for correct filled silhouette.</div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><script type="module">import * as THREE from "three";import {OrbitControls}from"three/addons/controls/OrbitControls.js";
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8a7a65);scene.fog=new THREE.FogExp2(0x8a7a65,0.01);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,500);camera.position.set(15,8,15);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.target.set(0,1,0);
const sun=new THREE.DirectionalLight(0xffeedd,2);sun.position.set(30,40,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.camera.far=100;scene.add(sun);
scene.add(new THREE.HemisphereLight(0x87ceeb,0x7a5e3e,0.6));
scene.add(new THREE.AmbientLight(0x404048,0.3));
// Ground plane with PBR
const gnd=new THREE.PlaneGeometry(100,100,64,64);gnd.rotateX(-Math.PI/2);
const gMat=new THREE.MeshStandardMaterial({color:0xa88860,roughness:0.95,metalness:0});const ground=new THREE.Mesh(gnd,gMat);ground.receiveShadow=true;scene.add(ground);
// Helper functions
function noise3(x,y,z){let h=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return h-Math.floor(h)}
function fbm3(x,y,z,oct){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=a*noise3(x*f,y*f,z*f);a*=0.5;f*=2.1}return v}
function chamferBox(w,h,d,bevel){const s=new THREE.Shape();const hw=w/2,hh=h/2,b=bevel;s.moveTo(-hw+b,-hh);s.lineTo(hw-b,-hh);s.lineTo(hw,-hh+b);s.lineTo(hw,hh-b);s.lineTo(hw-b,hh);s.lineTo(-hw+b,hh);s.lineTo(-hw,hh-b);s.lineTo(-hw,-hh+b);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:2});g.rotateX(-Math.PI/2);g.translate(0,h/2,0);return g}
function autoEdgeWear(geo,amount=0.9){const ca=new Float32Array(geo.attributes.position.count*3).fill(0.2);geo.setAttribute("color",new THREE.BufferAttribute(ca,3))}

// ============ SANDBAG - Lp-ball (NOT ellipsoid) ============
// Reference: "A filled sandbag is a rounded BOX - flat where compressed, square shoulders,
// ears bulging at corners, sewn seam ridge over the top, tied folded neck at one end"
// box param p=2=sphere, p=4=nearly brick. Default 3.1 (filled bag silhouette).
function sandbagGeo(variant=0,w=0.5,h=0.17,d=0.3){const {box:lp=3.1,lump=1}={box:3.1,lump:1};const g=new THREE.SphereGeometry(0.5,24,16);const pos=g.getAttribute("position");const seed=Math.random()*50;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);let ux=x*2,uy=y*2,uz=z*2;const p=lp;const q=Math.pow(Math.abs(ux),p)+Math.pow(Math.abs(uy),p)+Math.pow(Math.abs(uz),p);const f=q>1e-6?1/Math.pow(q,1/p):1;ux*=f;uy*=f;uz*=f;const flat=uy>0?1-uy*uy*0.2:1;const n=fbm3(ux*3.4+seed,uy*3.4+seed,uz*3.4+seed,3)-0.5;const n2=fbm3(ux*9+seed*2,uy*8+seed,uz*9+seed*3,2)-0.5;let nx=ux*w*0.5*(1+n*0.09*lump);let nz=uz*d*0.5*flat*(1+n*0.26*lump+n2*0.11*lump);let ny=uy*h*0.5*(1+n*0.24*lump+n2*0.1*lump);const t=nx/(w*0.5);const neck=Math.max(0,Math.abs(t)-0.7)/0.3;nz*=1-neck*neck*0.3;ny*=1-neck*neck*0.55;if(neck>0.55)ny+=Math.sign(uy)*h*0.02*(neck-0.55)*2;if(uy>0.15)ny+=h*0.05*Math.exp(-(z/(d*0.42))*(z/(d*0.42))*6)*(1-neck*0.8);if(variant===0){nz*=1+0.06*Math.cos(t*2.6)}else if(variant===1){nx+=w*0.04*t;const fatter=1+0.13*(0.5-t);nz*=fatter;ny*=fatter*(1-0.16*Math.exp(-((t/0.32)*(t/0.32))));if(uy>0.3)ny-=h*0.05*Math.exp(-((t/0.45)*(t/0.45)))}else{const crease=Math.exp(-(((t-0.1)/0.16)*((t-0.1)/0.16)));nz*=1-crease*0.2;ny*=1-crease*0.26;if(t>0.5){ny*=1-(t-0.5)*0.5;nz*=1+(t-0.5)*0.22}}pos.setXYZ(i,nx,ny,nz)}g.computeVertexNormals();return g}

// ============ CRATE ============
function crateGeo(s=0.62,slats=true,seed=Math.random()){const g=chamferBox(s,s*0.85,s*0.92,0.012);if(slats){const n=3;for(let i=0;i<n;i++){const y=-s*0.32+(i/(n-1))*s*0.64;const loose=Math.random()<0.18;const sg=chamferBox(s*1.01,s*0.14,0.016,0.004);sg.translate(0,y,s*0.46);if(loose)sg.rotateZ((Math.random()-0.5)*0.12);g.merge(sg);const sg2=chamferBox(s*1.01,s*0.14,0.016,0.004);sg2.translate(0,y,-s*0.46);g.merge(sg2);const sg3=chamferBox(0.016,s*0.14,s*0.94,0.004);sg3.translate(s*0.5,y,0);g.merge(sg3);const sg4=chamferBox(0.016,s*0.14,s*0.94,0.004);sg4.translate(-s*0.5,y,0);g.merge(sg4)}const lid=4;for(let i=0;i<lid;i++){const z=-s*0.46+((i+0.5)/lid)*s*0.92;const sg=chamferBox(s*1.0,0.02,(s*0.92)/lid-0.012,0.004);sg.translate(0,s*0.425+0.012,z);g.merge(sg)}for(const sx of[-1,1])for(const sz of[-1,1]){const sg=chamferBox(0.05,s*0.86,0.05,0.006);sg.translate(sx*s*0.48,0,sz*s*0.44);g.merge(sg)}}autoEdgeWear(g,0.85);return g}

// ============ JERSEY BARRIER - Compound wall shape ============
function jerseyBarrierGeo(){const g=new THREE.Group();const segs=8;for(let i=0;i<segs;i++){const t=i/(segs-1);const hw=0.31;const baseS=0.62-(t*0.02);const baseH=0.18;const base=chamferBox(baseS,baseH,1.0/segs-0.02,0.04);base.translate(0,baseH/2,(i-(segs-1)/2)*(1.0/segs));base.position.set(0,0,(i-(segs-1)/2)*(1.0/segs));const body=chamferBox(hw*2,0.92,1.0/segs-0.02,0.04);body.translate(0,baseH+0.92/2,(i-(segs-1)/2)*(1.0/segs));g.add(body);const top=chamferBox(hw*1.8,0.06,1.0/segs-0.02,0.02);top.translate(0,baseH+0.92+0.03,(i-(segs-1)/2)*(1.0/segs));g.add(top);const baseM=chamferBox(baseS,baseH,1.0/segs-0.02,0.04);g.add(baseM)}return g}

// ============ BURNT CAR ============
function burntCar(){const g=new THREE.Group();const body=new THREE.Mesh(chamferBox(4.5,1.3,1.8,0.05),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.9,metalness:0.2}));body.castShadow=true;g.add(body);const cabinGeo=new THREE.BoxGeometry(2.5,0.7,1.6);const cpos=cabinGeo.getAttribute("position");for(let i=0;i<cpos.count;i++){const x=cpos.getX(i),y=cpos.getY(i),z=cpos.getZ(i);cpos.setX(i,x+(Math.random()-0.5)*0.1);cpos.setY(i,y-Math.random()*0.2);if(y>0.2)cpos.setX(i,x+(Math.random()-0.5)*0.05)}cabinGeo.computeVertexNormals();const cabin=new THREE.Mesh(cabinGeo,new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95,transparent:true,opacity:0.7}));cabin.position.set(-0.2,1.0,0);cabin.castShadow=true;g.add(cabin);for(let i=0;i<4;i++){const wg=new THREE.CylinderGeometry(0.35,0.35,0.2,12);const w=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0x080808,roughness:0.95}));w.rotation.x=Math.PI/2;const dx=i<2?-1.4:1.4;const dz=i%2===0?0.9:-0.9;w.position.set(dx,0.35,dz);w.castShadow=true;g.add(w);if(Math.random()<0.5){w.scale.x=0.7}}for(let i=0;i<12;i++){const sg=new THREE.SphereGeometry(0.15+Math.random()*0.2,6,4);const dent=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95}));dent.position.set((Math.random()-0.5)*3,0.3+Math.random()*1.0,(Math.random()-0.5)*1.4+(Math.random()>0.5?0.7:-0.7));dent.scale.y=0.3;g.add(dent)}return g}

// ============ GROUND SKIRT (cheap grounding cue) ============
function groundSkirt(x,y,z,radius,seed=Math.random()){const r=radius*(1+seed*0.4);const pts=[];const n=14;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=0.5*(1+0.3*Math.sin(seed*100+a*3));pts.push(new THREE.Vector2(Math.cos(a)*rr*r,Math.sin(a)*rr*r))}const shape=new THREE.Shape(pts);const g=new THREE.ShapeGeometry(shape,12);g.rotateX(-Math.PI/2);const m=new THREE.MeshStandardMaterial({color:0x6a5538,roughness:1});const m2=new THREE.Mesh(g,m);m2.position.set(x,y+0.005,z);m2.receiveShadow=true;return m2}

// ============ MERLON (sandbag wall crest) ============
function merlonGeo(w=0.4,h=0.25,d=0.7){return chamferBox(w,h,d,0.05)}

const sandbagMat=new THREE.MeshStandardMaterial({color:0x9a8b7a,roughness:0.95,metalness:0});const sandbagMatB=new THREE.MeshStandardMaterial({color:0x8a7a68,roughness:0.95});const sandbagMatC=new THREE.MeshStandardMaterial({color:0xab9a85,roughness:0.95});
const woodMat=new THREE.MeshStandardMaterial({color:0x7a5a3a,roughness:0.8});const woodDarkMat=new THREE.MeshStandardMaterial({color:0x4a3a26,roughness:0.85});const metalRustedMat=new THREE.MeshStandardMaterial({color:0x5a4a3a,roughness:0.7,metalness:0.4});const concreteMat=new THREE.MeshStandardMaterial({color:0x9a9a96,roughness:0.85});const burlapMat=new THREE.MeshStandardMaterial({color:0xb8a890,roughness:0.95});
let propCount=0;const props=[];
function addProp(mesh,x=0,y=0,z=0,ry=0,sx=1,sy=1,sz=1,skirt=0){if(skirt>0){scene.add(groundSkirt(x,0,z,skirt))}mesh.position.set(x,y,z);mesh.rotation.y=ry;mesh.scale.set(sx,sy,sz);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);props.push(mesh);propCount++}

// ============ DEMO BUILDERS ============
function buildSandbagWall(cx,cy,cz,len,height){const rows=Math.ceil(height/0.18);const bagsPerRow=Math.ceil(len/0.5);for(let r=0;r<rows;r++){const ry=(r%2)*0.05;for(let i=0;i<bagsPerRow;i++){const v=Math.floor(Math.random()*3);const g=sandbagGeo(v,0.48,0.17,0.27);const bag=new THREE.Mesh(g,v===0?sandbagMat:v===1?sandbagMatB:sandbagMatC);addProp(bag,cx-len/2+(i+0.5)*(len/bagsPerRow)+ry,cy+r*0.15,cz,Math.random()*0.15,1,1,1,0.15)}}}
function buildMerlonRun(x0,x1,y,z,depth=0.34){const len=x1-x0;const n=Math.max(2,Math.floor(len/0.4));for(let i=0;i<n;i++){const t=(i+0.5)/n;const m=new THREE.Mesh(merlonGeo(0.38,0.28,depth),sandbagMat);addProp(m,x0+t*len,y,z,0,1,1,1,0.1)}}
function buildJerseyWall(x0,z,ry,len){const n=Math.ceil(len/1.0);for(let i=0;i<n;i++){const j=new THREE.Mesh(chamferBox(0.62,0.92,0.95,0.04).translate(0,0.46,0),concreteMat);addProp(j,x0+(i+0.5)*(len/n),0,z,ry)}}
function buildBurntCar(x,z,ry){const car=burntCar();addProp(car,x,0,z,ry,1,1,1,0.4)}
function buildCrate(x,z,scale,rot=0,slats=true){const c=new THREE.Mesh(crateGeo(scale,slats),Math.random()<0.5?woodMat:woodDarkMat);addProp(c,x,scale*0.4,z,rot+Math.random()*0.1,1,1,1,0.35)}
function buildCheckpoint(){buildMerlonRun(-3,3,0.15,0,0.34);buildSandbagWall(0,0.4,1.5,2,3);buildJerseyWall(-2,3,Math.PI/2,2);buildBurntCar(4,2,-0.5);buildCrate(-4,2,0.5,0);buildCrate(-4.5,2.5,0.55,0);buildCrate(3,-3,0.6,0);buildCrate(3.3,-3.3,0.45,0);buildMerlonRun(2,5,0.15,-3.5,0.34)}
function buildAllProps(){props.forEach(p=>scene.remove(p));props.length=0;propCount=0;for(let i=0;i<20;i++){const v=Math.floor(Math.random()*3);const g=sandbagGeo(v,0.5,0.17,0.3);const bag=new THREE.Mesh(g,v===0?sandbagMat:v===1?sandbagMatB:sandbagMatC);addProp(bag,-15+i*1.5+Math.random()*0.5,0.08,5+Math.random()*1.5,Math.random()*0.2,1,1,1,0.12)}for(let i=0;i<6;i++){const j=new THREE.Mesh(chamferBox(0.62,0.92,0.95,0.04),concreteMat);addProp(j,-12+i*1.5,0.46,-3,Math.PI/2,1,1,1,0.4)}for(let i=0;i<15;i++){const s=0.4+Math.random()*0.4;buildCrate(-8+i*1.1,Math.random()*5-7,s,Math.random()*0.5)}for(let i=0;i<3;i++){buildBurntCar(-10+i*8,5+Math.random()*3,Math.random()*Math.PI*2)}buildCheckpoint();document.getElementById("count").textContent="Props: "+propCount}

let mode="all";document.getElementById("b-all").onclick=()=>{setMode("all")};document.getElementById("b-sand").onclick=()=>{setMode("sand")};document.getElementById("b-jersey").onclick=()=>{setMode("jersey")};document.getElementById("b-crate").onclick=()=>{setMode("crate")};document.getElementById("b-burn").onclick=()=>{setMode("burn")};document.getElementById("b-check").onclick=()=>{setMode("check")};
function setMode(m){mode=m;["b-all","b-sand","b-jersey","b-crate","b-burn","b-check"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById("b-"+(m==="sand"?"sand":m==="jersey"?"jersey":m==="crate"?"crate":m==="burn"?"burn":m==="check"?"check":"all")).classList.add("active");props.forEach(p=>scene.remove(p));props.length=0;propCount=0;
  if(m==="all"){buildAllProps()}else if(m==="sand"){for(let i=0;i<25;i++){const v=Math.floor(Math.random()*3);const g=sandbagGeo(v);const bag=new THREE.Mesh(g,v===0?sandbagMat:v===1?sandbagMatB:sandbagMatC);addProp(bag,-12+i*1.0,0.08,Math.random()*4-2,Math.random()*0.2)}buildSandbagWall(0,0,8,3,2)}else if(m==="jersey"){for(let i=0;i<10;i++){const j=new THREE.Mesh(chamferBox(0.62,0.92,0.95,0.04),concreteMat);addProp(j,-12+i*2.5,0.46,0,Math.PI/2)}}else if(m==="crate"){for(let i=0;i<20;i++){const s=0.4+Math.random()*0.4;buildCrate(-10+i*1.05,Math.random()*4-2,s,Math.random()*0.5)}}else if(m==="burn"){for(let i=0;i<4;i++){buildBurntCar(-8+i*5,Math.random()*4,Math.random()*Math.PI*2)}}else if(m==="check"){buildCheckpoint()}
  document.getElementById("count").textContent="Props: "+propCount}
buildAllProps();const clock=new THREE.Clock();
function anim(){requestAnimationFrame(anim);const dt=clock.getDelta();controls.update();renderer.render(scene,camera);document.getElementById("f").textContent=Math.round(1/dt)}
anim();window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
