.floor(y)&255,Z=Math.floor(z)&255;x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);const u=this._fade(x),v=this._fade(y),w=this._fade(z);const A=this.perm[X]+Y,AA=this.perm[A]+Z,AB=this.perm[A+1]+Z,B=this.perm[X+1]+Y,BA=this.perm[B]+Z,BB=this.perm[B+1]+Z;return this._lerp(this._lerp(this._lerp(this.grad(this.perm[AA],x,y,z),this.grad(this.perm[BA],x-1,y,z),u),this._lerp(this.grad(this.perm[AB],x,y-1,z),this.grad(this.perm[BB],x-1,y-1,z),u),v),this._lerp(this._lerp(this.grad(this.perm[AA+1],x,y,z-1),this.grad(this.perm[BA+1],x-1,y,z-1),u),this._lerp(this.grad(this.perm[AB+1],x,y-1,z-1),this.grad(this.perm[BB+1],x-1,y-1,z-1),u),v),w)}fbm(x,y,z,octaves=4){let value=0,amplitude=0.5,frequency=1;for(let i=0;i<octaves;i++){value+=amplitude*this.noise3(x*frequency,y*frequency,z*frequency);amplitude*=0.5;frequency*=2}return value}worley(x,y){const xi=Math.floor(x),yi=Math.floor(y);let minDist=1e9;for(let dx=-1;dx<=1;dx++){for(let dy=-1;dy<=1;dy++){const px=xi+dx,py=yi+dy;const h=this._hash(px,py,0),h2=this._hash(px,py,1);const dist=Math.hypot(x-dx-h,y-dy-h2);if(dist<minDist)minDist=dist}}return minDist}clamp01(v){return Math.max(0,Math.min(1,v))}}class TextureForge{constructor(size=512){this.size=size;this.noise=new Noise(42);this.canvas=document.createElement("canvas");this.canvas.width=size;this.canvas.height=size;this.ctx=this.canvas.getContext("2d")}buildConcrete(){const n=this.noise,ctx=this.ctx;const img=ctx.createImageData(this.size,this.size);const data=img.data;for(let y=0;y<this.size;y++){for(let x=0;x<this.size;x++){const u=x/this.size*8,v=y/this.size*8;const base=n.fbm(u,v,0,5)*0.5+0.5;const detail=n.noise3(u*4,v*4,0)*0.5+0.5;const pores=n.worley(u*12,v*12);const agg=n.fbm(u*20,v*20,0,3)*0.15;let r=(base*0.4+detail*0.3+pores*0.2+agg)*255;r=n.clamp01(r)*255;const idx=(y*this.size+x)*4;data[idx]=r;data[idx+1]=r*0.98;data[idx+2]=r*0.95;data[idx+3]=255}}ctx.putImageData(img,0,0);const tex=new THREE.CanvasTexture(this.canvas);tex.wrapS=tex.wrapT=THREE.RepeatWrapping truck"],[5,15,"sedan"],[-3,35,"wreck"]].forEach(v=>{const ve=vg.gen(v[2]);ve.position.set(v[0],0,v[1]);this.scene.add(ve)});this._genProps();this.particles=new ParticleSys(this.scene)}_genGround(){const size=200;const geo=new THREE.PlaneGeometry(size,size,128,128);geo.rotateX(-Math.PI/2);const pos=geo.getAttribute("position");const colors=new Float32Array(pos.count*3);const noise=new Noise(777);for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const height=noise.fbm(x*0.02,0,z*0.02,4)*0.5;pos.setY(i,height);const sv=noise.fbm(x*0.1,z*0.1,0,3)*0.5+0.5;colors[i*3]=sv*0.8;colors[i*3+1]=sv*0.7;colors[i*3+2]=sv*0.5}geo.setAttribute("color",new THREE.BufferAttribute(colors,3));geo.computeVertexNormals();const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0}));ground.receiveShadow=true;this.scene.add(ground);const rGeo=new THREE.PlaneGeometry(12,size,12,64);rGeo.rotateX(-Math.PI/2);const rPos=rGeo.getAttribute("position");const rColors=new Float32Array(rPos.count*3);for(let i=0;i<rPos.count;i++){const x=rPos.getX(i),z=rPos.getZ(i);const camber=(1-(x/6)**2)*0.08;rPos.setY(i,camber);const av=noise.noise3(x*2,z*2,0)*0.1+0.15;rColors[i*3]=av*0.9;rColors[i*3+1]=av*0.9;rColors[i*3+2]=av*0.85}rGeo.setAttribute("color",new THREE.BufferAttribute(rColors,3));rGeo.computeVertexNormals();const road=new THREE.Mesh(rGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,metalness:0.1}));road.position.y=0.01;road.receiveShadow=true;this.scene.add(road);const mMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5});for(let i=0;i<40;i++){const z=-size/2+i*5+2.5;const dash=new THREE.Mesh(new THREE.PlaneGeometry(0.15,2),mMat);dash.rotation.x=-Math.PI/2;dash.position.set(0,0.02,z);this.scene.add(dash)}const sMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.85});for(let side of[-1,1]){const sw=new THREE.Mesh(new THREE.BoxGeometry(4,0.15,size),sMat);sw.position.set(side*9,0.075,0);sw.receiveShadow=true;sw.castShadow=true;this.scene.add(sw)}}_genProps(){const cMat=new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.8});[[-8,0.3,-15],[-9,0.3,-14],[10,0.3,25],[-12,0.3,5],[12,0.3,-35]].forEach(pos=>{const size=0.5+Math.random()*0.3;const crate=new THREE.Mesh(new THREE.BoxGeometry(size,size*0.8,size*0.9),cMat);crate.position.set(...pos);crate.rotation.y=Math.random()*0.3-0.15;crate.castShadow=true;crate.receiveShadow=true;this.scene.add(crate)});const bMat=new THREE.MeshStandardMaterial({color:0x444444,metalness:0.6,roughness:0.4});[[-15,0.5,10],[15,0.5,-20],[-10,0.5,-45]].forEach(pos=>{const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,1,16),bMat);barrel.position.set(...pos);barrel.castShadow=true;barrel.receiveShadow=true;this.scene.add(barrel)});const sMat=new THREE.MeshStandardMaterial({color:0x9a8b7a,roughness:0.95});[[-20,0.15,0],[20,0.15,0],[-20,0.45,0.4],[20,0.45,0.4],[-20,0.75,0.8],[20,0.75,0.8]].forEach(pos=>{const bag=new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.3,4,8),sMat);bag.position.set(...pos);bag.rotation.z=Math.PI/2;bag.rotation.y=Math.random()*0.2;bag.castShadow=true;bag.receiveShadow=true;this.scene.add(bag)})}_setupEvents(){window.addEventListener("resize",()=>this._resize());window.addEventListener("keydown",e=>{if(e.code==="Space")this._explode();if(e.key.toLowerCase()==="p")this.paused=!this.paused;if(e.key.toLowerCase()==="r"){this.time=14;this.sky.setTime(this.time)}});this.renderer.domElement.addEventListener("dblclick",()=>this._explode())}_explode(){const fwd=new THREE.Vector3();this.camera.getWorldDirection(fwd);const pos=new THREE.Vector3(fwd.x*15+(Math.random()-0.5)*10,0,fwd.z*15+(Math.random()-0.5)*10);this.particles.explode(pos,3)}_resize(){this.camera.aspect=window.innerWidth/window.innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(window.innerWidth,window.innerHeight)}_animate(){requestAnimationFrame(()=>this._animate());const dt=this.clock.getDelta();if(!this.paused){this.time+=dt*0.5;if(this.time>24)this.time=0;this.sky.setTime(this.time);this.particles.update(dt)}this.controls.update();this.renderer.render(this.scene,this.camera);const fps=Math.round(1/dt);document.getElementById("fps").textContent=fps;const h=Math.floor(this.time),m=Math.floor((this.time-h)*60);const td=document.getElementById("time-display");if(td)td.innerHTML="Time: "+h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0")+"<br/>"+(this.paused?"<em>PAUSED</em>":"")}}}new App()</script></body></html>
