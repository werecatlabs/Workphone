name: WPGraphics verification baseline
on:
  workflow_dispatch:
  push:
    paths: ['Engine/c/**', 'Engine/cpp/**', 'Dependencies/**', 'Tests/**', 'Tools/*WPGraphics*.ps1', 'Tools/ValidateClawGraphics.ps1', 'CMake/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/graphics-contracts.yml']
  pull_request:
    paths: ['Engine/c/**', 'Engine/cpp/**', 'Dependencies/**', 'Tests/**', 'Tools/*WPGraphics*.ps1', 'Tools/ValidateClawGraphics.ps1', 'CMake/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/graphics-contracts.yml']
permissions:
  contents: read
jobs:
  native-contracts:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated native contracts
        run: cmake --preset claw-contracts -G "Visual Studio 17 2022"
      - name: Build
        run: cmake --build project_graphics_contracts --config ${{ matrix.configuration }} --parallel 4
      - name: Test
        run: ctest --test-dir project_graphics_contracts -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --output-junit native-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.configuration }}
          path: project_graphics_contracts/native-results.xml
  graphics-catalog-resources:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate required graphics, catalog and resource tests
        shell: pwsh
        run: ./Tools/BuildWPGraphicsBaseline.ps1 -Configuration ${{ matrix.configuration }} -Generator "Visual Studio 17 2022"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpgraphics-${{ matrix.configuration }}
          path: |
            project_wpgraphics_baseline/baseline-*.log
            project_wpgraphics_baseline/claw-graphics-*-results.xml
            project_wpgraphics_baseline/claw-graphics-*-evidence.json
            project_wpgraphics_baseline/Testing/Temporary/LastTest.log
